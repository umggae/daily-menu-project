name: Daily Menu Generator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_date:
        description: '비우면 한국의 오늘 날짜 / 미리보기는 YYYY-MM-DD'
        type: string
        required: false
        default: ''
      meal:
        description: '점심/저녁 강제 지정 (auto면 한국시간 기준 자동 판단)'
        type: choice
        options: ['auto', 'lunch', 'dinner']
        default: 'auto'
  schedule:
    - cron: '30 1 * * *'  # UTC 01:30 = 한국시간 10:30, 점심 갱신
    - cron: '30 7 * * *'  # UTC 07:30 = 한국시간 16:30, 저녁 갱신

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate daily page
        env:
          PREVIEW_DATE: ${{ inputs.preview_date || '' }}
          MEAL: ${{ inputs.meal || 'auto' }}
        run: |
          ARGS="--output _site/index.html"
          if [ -n "$PREVIEW_DATE" ]; then
            ARGS="$ARGS --date $PREVIEW_DATE"
          fi
          if [ "$MEAL" != "auto" ] && [ -n "$MEAL" ]; then
            ARGS="$ARGS --meal $MEAL"
          fi
          python main.py $ARGS
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
